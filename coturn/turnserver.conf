# coturn configuration — time-limited shared-secret mode
# Managed via docker-compose volume mount

# Listening
listening-port=3478
tls-listening-port=5349

# Relay UDP port range (match firewall rules)
min-port=49152
max-port=65535

# Auth — time-limited HMAC-SHA1 shared secret (no static passwords)
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Realm
realm=${TURN_REALM}

# Logging (stdout for Docker)
log-file=stdout
no-stdout-log=0

# Security
no-tlsv1
no-tlsv1_1

# Disable STUN-only access
no-stun-bypass

# Fingerprint on all TURN messages
fingerprint

# Don't allow loopback relay (security)
no-loopback-peers
no-multicast-peers
