# coturn configuration — time-limited shared-secret mode
# Variables (${...}) are substituted at startup by coturn/entrypoint.sh via envsubst.
# TURN_SECRET, TURN_REALM, EXTERNAL_IP must be set in docker-compose environment.

# Listening
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# IMPORTANT for GCP/cloud: set external IP so coturn advertises the correct
# public address in XOR-RELAYED-ADDRESS responses.
# Set EXTERNAL_IP to your GCP VM's external IP in .env (e.g. 34.x.x.x).
external-ip=${EXTERNAL_IP}

# Relay UDP port range (match GCP firewall rules)
min-port=49152
max-port=65535

# Auth — time-limited HMAC-SHA1 shared secret (no static passwords)
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Realm
realm=${TURN_REALM}

# Logging (stdout for Docker)
log-file=stdout
no-stdout-log=0
verbose

# Security — disable old TLS versions
no-tlsv1
no-tlsv1_1

# Don't allow loopback relay (security)
no-loopback-peers
no-multicast-peers

# Fingerprint on all TURN messages
fingerprint

# Allow both UDP and TCP relay
# (TCP is important for networks that block UDP)
