<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Cute Retro TV Watching Icon -->

  <!-- Antennas (#F87D5C) -->
  <rect x="10" y="4" width="2" height="2" fill="#F87D5C"/>
  <rect x="20" y="4" width="2" height="2" fill="#F87D5C"/>
  <rect x="11" y="6" width="1" height="2" fill="#F87D5C"/>
  <rect x="20" y="6" width="1" height="2" fill="#F87D5C"/>
  <rect x="12" y="8" width="2" height="1" fill="#F87D5C"/>
  <rect x="18" y="8" width="2" height="1" fill="#F87D5C"/>

  <!-- TV Feet/Stand (#F87D5C) -->
  <rect x="7" y="27" width="3" height="1" fill="#F87D5C"/>
  <rect x="6" y="28" width="2" height="2" fill="#F87D5C"/>
  <rect x="22" y="27" width="3" height="1" fill="#F87D5C"/>
  <rect x="24" y="28" width="2" height="2" fill="#F87D5C"/>

  <!-- TV Main Body Base (#FEDCD3 - Primary Dominant Color) -->
  <rect x="4" y="9" width="24" height="18" fill="#FEDCD3"/>
  <rect x="5" y="8" width="22" height="1" fill="#FEDCD3"/>
  <rect x="5" y="27" width="22" height="1" fill="#FEDCD3"/>

  <!-- Screen Frame / Inner Bezel (#D4C4DE - Secondary Color) -->
  <rect x="6" y="11" width="16" height="14" fill="#D4C4DE"/>

  <!-- Screen Content / Emitting Glow (#FEDCD3) -->
  <rect x="7" y="12" width="14" height="12" fill="#FEDCD3"/>

  <!-- Cute Watching Face / Broadcast on Screen (#955DC2 & #D14E3A) -->
  <!-- Eyes (#955DC2) -->
  <rect x="9" y="15" width="2" height="3" fill="#955DC2"/>
  <rect x="17" y="15" width="2" height="3" fill="#955DC2"/>
  <rect x="9" y="15" width="1" height="1" fill="#FEDCD3"/><!-- Eye sparkle left -->
  <rect x="17" y="15" width="1" height="1" fill="#FEDCD3"/><!-- Eye sparkle right -->
  
  <!-- Happy Smile (#955DC2) -->
  <rect x="13" y="19" width="2" height="1" fill="#955DC2"/>
  <rect x="12" y="18" width="1" height="1" fill="#955DC2"/>
  <rect x="15" y="18" width="1" height="1" fill="#955DC2"/>

  <!-- Blush Pixels (#D14E3A - Medium-Low Usage) -->
  <rect x="8" y="18" width="2" height="1" fill="#D14E3A"/>
  <rect x="18" y="18" width="2" height="1" fill="#D14E3A"/>

  <!-- Side Control Panel -->
  <!-- Dials & Buttons (#D14E3A & #955DC2) -->
  <rect x="23" y="12" width="3" height="3" fill="#D14E3A"/>
  <rect x="24" y="13" width="1" height="1" fill="#FEDCD3"/>
  <rect x="23" y="17" width="3" height="3" fill="#D14E3A"/>
  <rect x="24" y="18" width="1" height="1" fill="#FEDCD3"/>

  <!-- Speaker Grille Slits (#955DC2 - Low Accent) -->
  <rect x="23" y="22" width="3" height="1" fill="#955DC2"/>
  <rect x="23" y="24" width="3" height="1" fill="#955DC2"/>

  <!-- Cute Watching Sparkles in the Air (#FEDCD3 / #D4C4DE) -->
  <rect x="2" y="5" width="1" height="3" fill="#D4C4DE"/>
  <rect x="1" y="6" width="3" height="1" fill="#D4C4DE"/>
  <rect x="28" y="7" width="1" height="3" fill="#D4C4DE"/>
  <rect x="27" y="8" width="3" height="1" fill="#D4C4DE"/>
</svg>
